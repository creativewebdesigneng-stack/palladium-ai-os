name: Runtime Workers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: palladium-runtime-workers
  cancel-in-progress: false

jobs:
  drain-queues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PALLADIUM_BASE_URL: ${{ secrets.PALLADIUM_BASE_URL }}
      WORKFLOW_RUNNER_CRON_SECRET: ${{ secrets.WORKFLOW_RUNNER_CRON_SECRET }}
      WEBHOOK_RETRY_CRON_SECRET: ${{ secrets.WEBHOOK_RETRY_CRON_SECRET }}
    steps:
      - name: Validate scheduler configuration
        shell: bash
        run: |
          missing=0

          if [ -z "$PALLADIUM_BASE_URL" ]; then
            echo "::error::PALLADIUM_BASE_URL is not configured; runtime workers cannot reach PalladiumAI."
            missing=1
          elif [[ "$PALLADIUM_BASE_URL" != https://* ]]; then
            echo "::error::PALLADIUM_BASE_URL must use https:// in production."
            missing=1
          fi

          if [ ${#WORKFLOW_RUNNER_CRON_SECRET} -lt 32 ]; then
            echo "::error::WORKFLOW_RUNNER_CRON_SECRET is missing or shorter than 32 characters; workflow queue draining is disabled."
            missing=1
          fi

          if [ ${#WEBHOOK_RETRY_CRON_SECRET} -lt 32 ]; then
            echo "::error::WEBHOOK_RETRY_CRON_SECRET is missing or shorter than 32 characters; webhook retry draining is disabled."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Runtime worker configuration is incomplete. Failing closed instead of reporting a false-green scheduler run."
            exit 1
          fi

      - name: Drain workflow queue
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $WORKFLOW_RUNNER_CRON_SECRET" \
            -H "Content-Type: application/json" \
            "${PALLADIUM_BASE_URL%/}/api/internal/workflow-runs?limit=4"

      - name: Drain webhook retry queue
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $WEBHOOK_RETRY_CRON_SECRET" \
            -H "Content-Type: application/json" \
            "${PALLADIUM_BASE_URL%/}/api/internal/webhook-retries?limit=50"
