name: Apply Email Send Patch

on:
  push:
    branches:
      - feature/approval-gated-email-send

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore(ci): apply email send patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/approval-gated-email-send
      - name: Apply exact email send patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/integrations/approved-action.server.ts')
          text = path.read_text()

          old_comment = ' * - Email approval creates a provider draft; it never sends mail.\n'
          new_comment = ' * - Email drafts remain drafts; email_send performs delivery only after approval is claimed.\n'
          assert old_comment in text
          text = text.replace(old_comment, new_comment, 1)

          old_block = '''  if (action.actionType === "email_send" || action.actionType === "email_draft") {
    if (provider !== "google" && provider !== "microsoft") {
      throw new Error("Email drafts require Google Workspace or Microsoft 365.");
    }
    const to = cleanHeader(details["to"], 254);
    const subject = cleanHeader(details["subject"], 200);
    const body = str(details["body"], MAX_EMAIL_BODY);
    if (!validEmail(to)) throw new Error("A valid recipient address is required.");
    if (!subject) throw new Error("An email subject is required.");
    if (!body) throw new Error("An email body is required.");

    if (provider === "google") {
      const mime = [
        `To: ${to}`,
        `Subject: ${subject}`,
        "MIME-Version: 1.0",
        'Content-Type: text/plain; charset="UTF-8"',
        "Content-Transfer-Encoding: 8bit",
        "",
        body,
      ].join("\\r\\n");
      return {
        provider,
        method: "POST",
        url: "https://gmail.googleapis.com/gmail/v1/users/me/drafts",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: { raw: base64Url(mime) } }),
      };
    }

    return {
      provider,
      method: "POST",
      url: "https://graph.microsoft.com/v1.0/me/messages",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        subject,
        body: { contentType: "Text", content: body },
        toRecipients: [{ emailAddress: { address: to } }],
      }),
    };
  }
'''

          new_block = '''  if (action.actionType === "email_send" || action.actionType === "email_draft") {
    if (provider !== "google" && provider !== "microsoft") {
      throw new Error("Email actions require Google Workspace or Microsoft 365.");
    }
    const to = cleanHeader(details["to"], 254);
    const subject = cleanHeader(details["subject"], 200);
    const body = str(details["body"], MAX_EMAIL_BODY);
    if (!validEmail(to)) throw new Error("A valid recipient address is required.");
    if (!subject) throw new Error("An email subject is required.");
    if (!body) throw new Error("An email body is required.");

    if (provider === "google") {
      const mime = [
        `To: ${to}`,
        `Subject: ${subject}`,
        "MIME-Version: 1.0",
        'Content-Type: text/plain; charset="UTF-8"',
        "Content-Transfer-Encoding: 8bit",
        "",
        body,
      ].join("\\r\\n");
      const raw = base64Url(mime);
      return {
        provider,
        method: "POST",
        url: action.actionType === "email_send"
          ? "https://gmail.googleapis.com/gmail/v1/users/me/messages/send"
          : "https://gmail.googleapis.com/gmail/v1/users/me/drafts",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(action.actionType === "email_send" ? { raw } : { message: { raw } }),
      };
    }

    const message = {
      subject,
      body: { contentType: "Text", content: body },
      toRecipients: [{ emailAddress: { address: to } }],
    };
    return {
      provider,
      method: "POST",
      url: action.actionType === "email_send"
        ? "https://graph.microsoft.com/v1.0/me/sendMail"
        : "https://graph.microsoft.com/v1.0/me/messages",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(action.actionType === "email_send"
        ? { message, saveToSentItems: true }
        : message),
    };
  }
'''

          assert old_block in text, 'expected email block not found'
          text = text.replace(old_block, new_block, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/integrations/approved-action.server.ts
          git diff --cached --check
          git commit -m "chore(ci): apply email send patch"
          git push origin HEAD:feature/approval-gated-email-send
