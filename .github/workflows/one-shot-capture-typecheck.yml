name: One-shot capture typecheck diagnostics

on:
  push:
    branches: [feat/builder-e2b-sandbox]
    paths: [.github/workflows/one-shot-capture-typecheck.yml]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builder-e2b-sandbox
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Capture exact TypeScript diagnostics
        run: |
          set +e
          bunx tsc --noEmit > .typecheck-diagnostics.txt 2>&1
          status=$?
          echo "exit_code=$status" >> .typecheck-diagnostics.txt
          rm .github/workflows/one-shot-capture-typecheck.yml
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .typecheck-diagnostics.txt .github/workflows/one-shot-capture-typecheck.yml
          git commit -m "chore: capture sandbox typecheck diagnostics"
          git push origin HEAD:feat/builder-e2b-sandbox
