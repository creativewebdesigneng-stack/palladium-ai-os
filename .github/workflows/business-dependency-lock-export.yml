name: Temporary patched dependency lock export

on:
  push:
    branches: [feat/six-agent-business-operations]
    paths:
      - .github/workflows/business-dependency-lock-export.yml

permissions:
  contents: write

jobs:
  export-patched-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Pin verified patched build dependencies
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const p = JSON.parse(fs.readFileSync('package.json','utf8'))
          p.devDependencies.vite = '8.3.3'
          p.overrides = { ...p.overrides, 'launch-editor': '2.14.2' }
          fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')
          NODE
          bun install --lockfile-only
          bun install --frozen-lockfile
          bun audit --audit-level high
      - name: Export manifest and frozen lock for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patched-business-dependencies
          path: |
            package.json
            bun.lock
          retention-days: 2
      - name: Commit verified dependency pins
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "security(deps): pin patched Vite 8.3.3 and launch-editor 2.14.2"
          git push origin HEAD:refs/heads/feat/six-agent-business-operations
