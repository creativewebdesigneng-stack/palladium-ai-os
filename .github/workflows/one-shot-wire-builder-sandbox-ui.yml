name: One-shot wire Builder sandbox UI

on:
  push:
    branches: [feat/builder-e2b-sandbox]
    paths: [.github/workflows/one-shot-wire-builder-sandbox-ui.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builder-e2b-sandbox
      - name: Patch Builder sandbox UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/Builder.jsx')
          s = p.read_text()
          def rep(old, new):
              global s
              assert old in s, f'missing pattern: {old[:80]}'
              s = s.replace(old, new, 1)

          rep("import { Bot, CheckCircle2, Code2, Database, GitBranch, Loader2, LockKeyhole, RefreshCw, Rocket, Sparkles, TriangleAlert, Workflow, X } from 'lucide-react';", "import { Bot, CheckCircle2, Code2, Database, GitBranch, Loader2, LockKeyhole, RefreshCw, Rocket, Sparkles, TerminalSquare, TriangleAlert, Workflow, X } from 'lucide-react';")
          rep("} from '@/lib/builder/builder.functions';", "} from '@/lib/builder/builder.functions';\nimport { listBuilderSandboxStates, runBuilderSandboxJob } from '@/lib/builder/builder-sandbox.functions';")
          rep("  const cancelFn = useServerFn(cancelBuilderJob);", "  const cancelFn = useServerFn(cancelBuilderJob);\n  const sandboxListFn = useServerFn(listBuilderSandboxStates);\n  const sandboxRunFn = useServerFn(runBuilderSandboxJob);")
          rep("  const repositories = useQuery({ queryKey: ['builder-github-repositories'], queryFn: () => repoListFn(), retry: false });", "  const repositories = useQuery({ queryKey: ['builder-github-repositories'], queryFn: () => repoListFn(), retry: false });\n  const sandboxStates = useQuery({ queryKey: ['builder-sandbox-states'], queryFn: () => sandboxListFn(), retry: false });")
          rep("  const refreshJobs = () => qc.invalidateQueries({ queryKey: ['builder-jobs'] });", "  const refreshJobs = () => qc.invalidateQueries({ queryKey: ['builder-jobs'] });\n  const refreshSandbox = () => qc.invalidateQueries({ queryKey: ['builder-sandbox-states'] });")
          rep("  const cancelJob = useMutation({", "  const sandboxRun = useMutation({\n    mutationFn: (id) => sandboxRunFn({ data: { id } }),\n    onSuccess: async (result) => { await refreshSandbox(); toast({ title: result.sandboxStatus === 'passed' ? 'Isolated validation passed' : 'Isolated validation finished', description: result.sandboxStatus === 'passed' ? 'Install and available build/typecheck/test scripts passed in E2B.' : 'Review the isolated stage logs below.' }); },\n    onError: async (error) => { await refreshSandbox(); toast({ title: 'Isolated validation failed', description: friendlyMessage(error), variant: 'destructive' }); },\n  });\n  const cancelJob = useMutation({")
          rep("description=\"Create durable requests, live AI plans and reviewable source, then move every GitHub mutation through explicit high-risk approval. Sandbox execution and deployment remain disabled.\"", "description=\"Create durable requests, live AI plans and reviewable source, move GitHub mutations through approval, then validate the generated app in an isolated E2B sandbox before deployment.\"")
          rep("<Requirement icon={Workflow} text=\"Sandboxed build/test execution remains disabled\" />", "<Requirement icon={Workflow} text=\"Isolated E2B install/build/typecheck/test validation is live\" ready />")
          rep("            const selectedRepository = repositoryChoice[job.id] ?? repositories.data?.[0]?.fullName ?? '';", "            const selectedRepository = repositoryChoice[job.id] ?? repositories.data?.[0]?.fullName ?? '';\n            const sandbox = (sandboxStates.data ?? []).find((state) => state.id === job.id) ?? { sandboxStatus: 'not_started', sandboxResults: null, sandboxLastError: null };\n            const isRunningSandbox = sandboxRun.isPending && sandboxRun.variables === job.id;")
          rep("                {['branch_approval_pending', 'branch_ready', 'files_approval_pending', 'files_applied', 'failed'].includes(job.repositoryStatus) && (", "                {job.repositoryStatus === 'files_applied' && <SandboxValidation job={job} sandbox={sandbox} pending={isRunningSandbox} onRun={() => sandboxRun.mutate(job.id)} />}\n                {['branch_approval_pending', 'branch_ready', 'files_approval_pending', 'files_applied', 'failed'].includes(job.repositoryStatus) && (")
          rep("        <StateCard icon={Rocket} title=\"Sandbox + deploy\" value=\"Remaining\" text=\"Execution, repair validation and deployment are not enabled yet.\" />", "        <StateCard icon={TerminalSquare} title=\"Sandbox validation\" value=\"Live · E2B\" text=\"Generated source is installed and checked in an isolated E2B sandbox.\" />\n        <StateCard icon={Rocket} title=\"Deployment\" value=\"Remaining\" text=\"Deployment and final production hardening are not enabled yet.\" />")
          rep("function RepositoryPicker({ job, repositories, selectedRepository, setRepositoryChoice, onQueue, pending }) {", "function SandboxValidation({ job, sandbox, pending, onRun }) {\n  const canRun = ['not_started', 'failed'].includes(sandbox.sandboxStatus) && !pending;\n  const stages = sandbox.sandboxResults?.stages ?? [];\n  return (\n    <div className=\"mt-4 rounded-xl border border-cyan-400/15 bg-cyan-400/[.035] p-4 text-[11px] leading-5 text-zinc-400\">\n      <div className=\"flex flex-wrap items-center justify-between gap-2\">\n        <div><div className=\"flex items-center gap-2 font-medium text-cyan-100\"><TerminalSquare className=\"h-4 w-4\" />Isolated E2B validation · {pending ? 'running' : sandbox.sandboxStatus.replaceAll('_', ' ')}</div><p className=\"mt-1 text-zinc-500\">Runs the exact persisted source manifest in a temporary sandbox. No validation command executes on the PalladiumAI app server.</p></div>\n        {canRun && <button onClick={onRun} disabled={pending} className=\"inline-flex items-center gap-1.5 rounded-lg bg-cyan-500/15 px-3 py-1.5 font-medium text-cyan-100 ring-1 ring-cyan-400/20 disabled:opacity-40\">{pending ? <Loader2 className=\"h-3.5 w-3.5 animate-spin\" /> : <TerminalSquare className=\"h-3.5 w-3.5\" />}{sandbox.sandboxStatus === 'failed' ? 'Retry isolated validation' : 'Run isolated validation'}</button>}\n      </div>\n      {sandbox.sandboxLastError && <ErrorBox text={sandbox.sandboxLastError} />}\n      {stages.length > 0 && <div className=\"mt-3 space-y-2\">{stages.map((stage) => <details key={stage.name} className=\"rounded-lg border border-white/10 bg-black/20\"><summary className=\"cursor-pointer px-3 py-2 text-zinc-300\">{stage.name} · {stage.status}{stage.exitCode != null ? ` · exit ${stage.exitCode}` : ''}</summary><div className=\"border-t border-white/10 p-3\">{stage.command && <p className=\"mb-2 font-mono text-[10px] text-zinc-500\">{stage.command}</p>}{stage.reason && <p>{stage.reason}</p>}{stage.stdout && <pre className=\"max-h-48 overflow-auto whitespace-pre-wrap text-[10px] text-zinc-400\">{stage.stdout}</pre>}{stage.stderr && <pre className=\"mt-2 max-h-48 overflow-auto whitespace-pre-wrap text-[10px] text-rose-300\">{stage.stderr}</pre>}</div></details>)}</div>}\n      {sandbox.sandboxId && <p className=\"mt-2 text-[10px] text-zinc-600\">E2B sandbox: {sandbox.sandboxId}</p>}\n    </div>\n  );\n}\n\nfunction RepositoryPicker({ job, repositories, selectedRepository, setRepositoryChoice, onQueue, pending }) {")
          p.write_text(s)
          PY
          rm .github/workflows/one-shot-wire-builder-sandbox-ui.yml
      - name: Commit UI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/Builder.jsx .github/workflows/one-shot-wire-builder-sandbox-ui.yml
          git commit -m "Wire Builder isolated sandbox validation UI"
          git push origin HEAD:feat/builder-e2b-sandbox
