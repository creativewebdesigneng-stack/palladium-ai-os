name: Blackstar Lock Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blackstar branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Regenerate patched lockfile
        run: |
          bun install
          bun audit --audit-level high

      - name: Commit lockfile only
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "fix(deps): refresh patched Bun lockfile [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
