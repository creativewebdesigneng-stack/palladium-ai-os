name: One-shot Astra dependency lockfile regeneration

on:
  push:
    branches:
      - feature/blackstar-local-gpu-verification-20261025
    paths:
      - .github/workflows/repair-astra-security-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.repository == 'creativewebdesigneng-stack/palladium-ai-os'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Regenerate lockfile using Bun
        run: bun install
      - name: Assert patched dependency versions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const lock = readFileSync('bun.lock', 'utf8')
          const pins = [
            '"undici": ["undici@7.30.1"',
            '"undici8": ["undici@8.12.2"',
            '"body-parser": ["body-parser@2.4.0"',
            '"zod": ["zod@4.6.6"',
            '"vite": ["vite@8.3.3"',
            '"launch-editor": ["launch-editor@2.14.2"',
          ]
          for (const pin of pins) {
            if (!lock.includes(pin)) throw Error('Expected secure pinned resolution missing: ' + pin)
          }
          NODE
      - name: Verify frozen lockfile and security
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level high
      - name: Commit generated lockfile to the review branch
        shell: bash
        run: |
          set -euo pipefail
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Generated lockfile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(lockfile): regenerate patched Blackstar dependencies using Bun"
          git push origin HEAD:feature/blackstar-local-gpu-verification-20261025
