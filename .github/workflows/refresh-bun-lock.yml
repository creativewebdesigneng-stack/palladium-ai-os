name: Refresh Bun Lock 
on:
  push:
    branches:
      - blackstar/native-writes-forwardport-20261006
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --lockfile-only
      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git diff --cached --quiet || git commit -m "Refresh Bun lock for MCP SDK security upgrade"
          git push origin HEAD:blackstar/native-writes-forwardport-20261006

      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-bun-lock
          path: bun.lock
          if-no-files-found: error
