name: Scheduled Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * *"

permissions:
  contents: read

concurrency:
  group: scheduled-security-audit
  cancel-in-progress: false

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: High severity dependency audit
        shell: bash
        run: |
          set -o pipefail
          bun audit --audit-level high 2>&1 | tee dependency-audit.log

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Blackstar scheduled dependency audit"
            echo
            echo '```text'
            if [ -f dependency-audit.log ]; then
              cat dependency-audit.log
            else
              echo "Dependency audit log was not produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: dependency-audit.log
          if-no-files-found: warn
          retention-days: 7
