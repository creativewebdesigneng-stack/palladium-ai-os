name: Security QA lockfile refresh (branch scoped)

on:
  push:
    branches:
      - security/dependency-audit-repair-20261102

permissions:
  contents: read

jobs:
  resolve-lockfile:
    if: github.repository == 'creativewebdesigneng-stack/palladium-ai-os' && github.ref == 'refs/heads/security/dependency-audit-repair-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout QA branch with read-only token
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pin Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve patched versions and regenerate lock
        run: bun install --ignore-scripts

      - name: Ensure resolver did not rewrite manifest
        run: git diff --exit-code -- package.json

      - name: Verify regenerated lockfile with frozen install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Upload authentic Bun lockfile for branch-only commit
        uses: actions/upload-artifact@v7
        with:
          name: patched-bun-lockfile
          path: bun.lock
          if-no-files-found: error
          retention-days: 2

  # The first job has no write credentials while running dependency installation.
  # This second job receives only the resolved lockfile, not node_modules or scripts.
  # No other branch may be updated, and no force-push or merge is performed.
  commit-qa-lockfile:
    needs: resolve-lockfile
    if: github.repository == 'creativewebdesigneng-stack/palladium-ai-os' && github.ref == 'refs/heads/security/dependency-audit-repair-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout only expected QA branch
        uses: actions/checkout@v7
        with:
          ref: security/dependency-audit-repair-20261102
          persist-credentials: true

      - name: Refuse unexpected branch movement
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download checked Bun lockfile
        uses: actions/download-artifact@v7
        with:
          name: patched-bun-lockfile
          path: .

      - name: Commit generated lockfile only (never main)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "security/dependency-audit-repair-20261102"
          git diff --exit-code -- package.json
          git add -- bun.lock
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "bun.lock"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(security): regenerate Bun lock with patched dependencies"
          git push origin HEAD:refs/heads/security/dependency-audit-repair-20261102

  # Security audit runs after the generated lock has been committed to the
  # named QA branch, so a failing audit never silently discards the lockfile.
  # A high-severity advisory is a hard failure, not a warning.
  audit-generated-lockfile:
    needs: commit-qa-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout generated QA branch
        uses: actions/checkout@v7
        with:
          ref: security/dependency-audit-repair-20261102
          persist-credentials: false

      - name: Pin Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify frozen lockfile and install
        run: bun install --frozen-lockfile

      - name: High severity dependency audit (blocking)
        run: bun audit --audit-level high

      - name: Production build for compatibility
        run: bun run build

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Unit tests
        env:
          OPENAI_API_KEY: ci-test-provider-placeholder
        run: bun run test

