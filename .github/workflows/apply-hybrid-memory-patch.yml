name: Apply Hybrid Memory Patch

on:
  push:
    branches:
      - atomic-hybrid-memory-recall

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atomic-hybrid-memory-recall
          fetch-depth: 0
      - name: Patch memory search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/memory/memory.server.ts')
          source = path.read_text()

          ranking_import = 'import { rankHybridMemoryHits } from "./hybrid-memory-ranking";\n'
          anchor_import = 'import { getVectorStore, resolveVectorProvider, type VectorFilter } from "./vector-store.server";\n'
          if ranking_import not in source:
              if anchor_import not in source:
                  raise SystemExit('vector-store import anchor not found')
              source = source.replace(anchor_import, anchor_import + ranking_import, 1)

          start_marker = '/**\n * Semantic search with a keyword fallback, so memory still works when embeddings\n * are unavailable (missing credits, provider outage, not yet indexed).\n */\nexport async function searchMemory'
          start = source.find(start_marker)
          end_marker = '/* -------------------------------------------------- retrieveRelevantMemory */'
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('searchMemory replacement anchors not found')

          replacement = r'''/**
 * Hybrid memory retrieval: semantic/vector recall and exact lexical recall are
 * complementary signals. Either path may fail independently; successful hits
 * from the other path are still returned. Ranking bonuses never overwrite the
 * public semantic `similarity` value on a hit.
 */
export async function searchMemory(args: {
  sb: Sb;
  userId: string;
  query: string;
  limit?: number;
  agentId?: string | null;
  types?: MemoryType[] | null;
  includeDocuments?: boolean;
}): Promise<MemorySearchHit[]> {
  const query = clean(args.query, 2000);
  if (!query) return [];
  const limit = Math.min(Math.max(args.limit ?? 8, 1), 25);

  const keywordPromise = keywordSearch(
    args.sb,
    query,
    limit,
    args.agentId ?? null,
    args.types ?? null,
  ).catch((error) => {
    console.error("[memory] keyword search unavailable", error);
    return [] as MemorySearchHit[];
  });

  const semanticHits: MemorySearchHit[] = [];
  try {
    const { vector } = await embedOne(query);
    const { data: rows, error } = await args.sb.rpc("search_agent_memories", {
      _embedding: vector as unknown as string,
      _match_count: limit,
      _agent: args.agentId ?? null,
      _types: args.types ?? null,
    });
    if (error) throw new Error(error.message);
    for (const row of rows ?? []) {
      semanticHits.push({
        id: row.id,
        content: row.content,
        title: row.title,
        memory_type: row.memory_type,
        scope: row.scope,
        category: row.category,
        similarity: Number(row.similarity ?? 0),
        kind: "memory",
      });
    }

    if (args.includeDocuments !== false) {
      const { data: chunks, error: chunkError } = await args.sb.rpc("search_memory_chunks", {
        _embedding: vector as unknown as string,
        _match_count: Math.min(limit, 6),
        _agent: args.agentId ?? null,
      });
      if (chunkError) throw new Error(chunkError.message);
      for (const chunk of chunks ?? []) {
        semanticHits.push({
          id: chunk.id,
          content: chunk.content,
          similarity: Number(chunk.similarity ?? 0),
          kind: "document",
          document_id: chunk.document_id,
        });
      }
    }
  } catch (error) {
    console.error("[memory] semantic search unavailable", error);
  }

  const keywordHits = await keywordPromise;
  return rankHybridMemoryHits({
    semantic: semanticHits,
    keyword: keywordHits,
    query,
    limit,
  });
}

async function keywordSearch(
  sb: Sb,
  query: string,
  limit: number,
  agentId: string | null,
  types: MemoryType[] | null,
): Promise<MemorySearchHit[]> {
  const safe = query.replace(/[%,()]/g, " ").trim();
  let q = sb
    .from("agent_memories")
    .select("id,title,content,memory_type,scope,category")
    .order("pinned", { ascending: false })
    .order("updated_at", { ascending: false })
    .limit(limit);
  if (safe) q = q.or(`content.ilike.%${safe}%,title.ilike.%${safe}%`);
  if (agentId) q = q.or(`agent_id.is.null,agent_id.eq.${agentId}`);
  if (types?.length) q = q.in("memory_type", types);
  const { data, error } = await q;
  if (error) throw new Error(error.message);
  return (data ?? []).map((row: any) => ({
    id: row.id,
    content: row.content,
    title: row.title,
    memory_type: row.memory_type,
    scope: row.scope,
    category: row.category,
    similarity: 0,
    kind: "memory" as const,
  }));
}

'''
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Focused hybrid memory tests
        run: bunx vitest run src/lib/memory/__tests__/hybrid-memory-ranking.test.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/memory/memory.server.ts
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "Fuse semantic and keyword memory recall"
            git push origin HEAD:atomic-hybrid-memory-recall
          fi
