name: Patch Astra generic error route probe
on:
  push:
    branches:
      - blackstar/astra-generic-error-route-probe
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blackstar/astra-generic-error-route-probe
          fetch-depth: 0
      - name: Apply bounded route-probe diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          diagnostics = Path('src/lib/evals/astra-certification-stage-diagnostics.ts')
          text = diagnostics.read_text()
          text = text.replace("  | 'candidate_runtime_error_object'\n", "  | 'candidate_runtime_error_object'\n  | 'candidate_route_reachable_runtime_failure'\n")
          text = text.replace("    case 'candidate_runtime_error_object':\n    case 'candidate_runtime_range_error':", "    case 'candidate_runtime_error_object':\n    case 'candidate_route_reachable_runtime_failure':\n    case 'candidate_runtime_range_error':")
          text = text.replace("    case 'candidate_runtime_error_object':\n      return { code: 'candidate_runtime_error_object', message: 'The native Astra execution path threw a generic runtime Error before a trusted candidate response completed.' } as const\n", "    case 'candidate_runtime_error_object':\n      return { code: 'candidate_runtime_error_object', message: 'The native Astra execution path threw a generic runtime Error before a trusted candidate response completed.' } as const\n    case 'candidate_route_reachable_runtime_failure':\n      return { code: 'candidate_route_reachable_runtime_failure', message: 'The exact native Astra route is reachable and accepted the bounded health probe, but candidate execution still failed inside the runtime before a trusted response completed.' } as const\n")
          diagnostics.write_text(text)

          helper = Path('src/lib/evals/astra-candidate-route-probe.server.ts')
          helper.write_text("""import { candidateFailureStage, type AstraTextCertificationStage } from './astra-certification-stage-diagnostics'\n\nconst PROBE_TIMEOUT_MS = 10_000\n\nfunction genericProbeFailure(stage: AstraTextCertificationStage): boolean {\n  return stage === 'candidate_runtime_error_object'\n    || stage === 'candidate_runtime_unknown_object'\n    || stage === 'candidate_runtime_non_error'\n}\n\nexport function classifyAstraCandidateRouteProbeStatus(status: number): AstraTextCertificationStage {\n  if (status === 401 || status === 403) return 'candidate_credentials_rejected'\n  if (status === 429) return 'candidate_rate_limited'\n  if (status === 408 || status === 504) return 'candidate_timeout_or_unreachable'\n  if (status === 502 || status === 503 || status >= 500) return 'candidate_upstream_unavailable'\n  return 'candidate_route_reachable_runtime_failure'\n}\n\nexport async function probeAstraCandidateRouteAfterGenericError(): Promise<AstraTextCertificationStage> {\n  const rawBase = process.env['OPENAI_COMPATIBLE_BASE_URL']?.trim()\n  if (!rawBase) return 'candidate_runtime_error_object'\n  const base = rawBase.replace(/\\/+$/, '')\n  const apiKey = process.env['OPENAI_COMPATIBLE_API_KEY']?.trim()\n\n  try {\n    const response = await fetch(`${base}/models`, {\n      method: 'GET',\n      headers: apiKey ? { Authorization: `Bearer ${apiKey}` } : undefined,\n      signal: AbortSignal.timeout(PROBE_TIMEOUT_MS),\n    })\n    return classifyAstraCandidateRouteProbeStatus(response.status)\n  } catch (error) {\n    const stage = candidateFailureStage(error)\n    return genericProbeFailure(stage) ? 'candidate_network_unreachable' : stage\n  }\n}\n""")

          runner = Path('src/lib/evals/astra-text-certification-run.server.ts')
          text = runner.read_text()
          text = text.replace("import { astraCertificationStageError, candidateFailureStage, type AstraTextCertificationStage } from './astra-certification-stage-diagnostics'\n", "import { astraCertificationStageError, candidateFailureStage, type AstraTextCertificationStage } from './astra-certification-stage-diagnostics'\nimport { probeAstraCandidateRouteAfterGenericError } from './astra-candidate-route-probe.server'\n")
          text = text.replace("      stage = candidateFailureStage(error)\n      throw astraCertificationStageError(stage)\n", "      stage = candidateFailureStage(error)\n      if (stage === 'candidate_runtime_error_object') {\n        stage = await probeAstraCandidateRouteAfterGenericError()\n      }\n      throw astraCertificationStageError(stage)\n", 1)
          runner.write_text(text)

          test = Path('src/lib/evals/astra-candidate-route-probe.server.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest'\nimport { classifyAstraCandidateRouteProbeStatus } from './astra-candidate-route-probe.server'\n\ndescribe('Astra candidate route probe', () => {\n  it('maps bounded HTTP status without exposing response text', () => {\n    expect(classifyAstraCandidateRouteProbeStatus(200)).toBe('candidate_route_reachable_runtime_failure')\n    expect(classifyAstraCandidateRouteProbeStatus(404)).toBe('candidate_route_reachable_runtime_failure')\n    expect(classifyAstraCandidateRouteProbeStatus(401)).toBe('candidate_credentials_rejected')\n    expect(classifyAstraCandidateRouteProbeStatus(403)).toBe('candidate_credentials_rejected')\n    expect(classifyAstraCandidateRouteProbeStatus(429)).toBe('candidate_rate_limited')\n    expect(classifyAstraCandidateRouteProbeStatus(502)).toBe('candidate_upstream_unavailable')\n    expect(classifyAstraCandidateRouteProbeStatus(503)).toBe('candidate_upstream_unavailable')\n    expect(classifyAstraCandidateRouteProbeStatus(504)).toBe('candidate_timeout_or_unreachable')\n  })\n})\n""")
          PY
          rm .github/workflows/patch-astra-route-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/evals/astra-certification-stage-diagnostics.ts src/lib/evals/astra-candidate-route-probe.server.ts src/lib/evals/astra-candidate-route-probe.server.test.ts src/lib/evals/astra-text-certification-run.server.ts .github/workflows/patch-astra-route-probe.yml
          git commit -m 'Probe native Astra route after generic runtime errors'
          git push origin HEAD:blackstar/astra-generic-error-route-probe
