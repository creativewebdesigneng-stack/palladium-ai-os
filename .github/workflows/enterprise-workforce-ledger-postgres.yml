name: Enterprise Workforce Approval & Audit (Isolated Real PostgreSQL)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workforce-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact QA commit
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Execute canonical approval migrations and real isolated PostgreSQL access checks
        run: node scripts/verification/enterprise-workforce-ledger-postgres.mjs
