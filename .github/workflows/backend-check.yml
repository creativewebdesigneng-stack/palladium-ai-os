name: Backend Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: High severity dependency audit
        shell: bash
        run: |
          set +e
          transient=0
          for attempt in 1 2; do
            echo "Dependency audit attempt ${attempt}/2"
            : > audit-output.log
            timeout --signal=TERM --kill-after=5s 30s bun audit --audit-level high 2>&1 | tee audit-output.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi

            transient=0
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || grep -Eqi 'ConnectionClosed|audit request failed|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|socket hang up|network' audit-output.log; then
              transient=1
            fi

            if [ "$transient" -eq 1 ]; then
              if [ "$attempt" -lt 2 ]; then
                echo "Transient audit service/network failure; retrying once."
                sleep 5
                continue
              fi
              echo "::warning title=Dependency audit unavailable::bun audit timed out or hit a network/service error after two bounded attempts. No advisory result was returned; continuing with build, typecheck and tests."
              exit 0
            fi

            # A non-transient nonzero result is a real audit failure (for example,
            # a high-severity advisory) and must continue to block CI.
            exit "$rc"
          done

          exit 1

      - name: Production build and route generation
        run: bun run build

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck-output.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-output
          path: typecheck-output.log
          if-no-files-found: warn
          retention-days: 1

      - name: Tests
        env:
          # Runtime model calls are mocked in Vitest. This non-secret placeholder
          # lets provider-preflight coverage reach those mocked execution paths.
          OPENAI_API_KEY: ci-test-provider-placeholder
        run: bun run test -- --reporter=junit --outputFile=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Browser worker syntax and policy tests
        working-directory: browser-worker
        run: |
          npm run check
          npm test
