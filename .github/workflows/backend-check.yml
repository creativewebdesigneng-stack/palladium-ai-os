name: Backend Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: High severity dependency audit
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Dependency audit attempt ${attempt}/3"
            bun audit --audit-level high 2>&1 | tee audit-output.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if grep -Eqi 'ConnectionClosed|audit request failed|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|socket hang up|network' audit-output.log && [ "$attempt" -lt 3 ]; then
              echo "Transient audit service/network failure; retrying."
              sleep $((attempt * 5))
              continue
            fi
            exit "$rc"
          done
          exit 1

      - name: Production build and route generation
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        env:
          # Runtime model calls are mocked in Vitest. This non-secret placeholder
          # lets provider-preflight coverage reach those mocked execution paths.
          OPENAI_API_KEY: ci-test-provider-placeholder
        run: bun run test -- --reporter=junit --outputFile=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Browser worker syntax and policy tests
        working-directory: browser-worker
        run: |
          npm run check
          npm test
