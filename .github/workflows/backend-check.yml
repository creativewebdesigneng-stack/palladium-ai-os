name: Backend Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: High severity dependency audit
        run: bun audit --audit-level high

      - name: Production build and route generation
        run: bun run build

      - name: Diagnose generated autonomy source
        run: |
          echo "Generated agent files:"
          find src/lib/agents -maxdepth 2 -type f -print | sort || true
          if [ -f src/lib/agents/agent-autonomy.server.ts ]; then
            echo "--- agent-autonomy.server.ts 150-210 ---"
            nl -ba src/lib/agents/agent-autonomy.server.ts | sed -n '150,210p'
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Browser worker syntax and policy tests
        working-directory: browser-worker
        run: |
          npm run check
          npm test
