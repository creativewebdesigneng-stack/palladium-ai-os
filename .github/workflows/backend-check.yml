name: Backend Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-undici-lock:
    name: Regenerate pinned Undici lockfile (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Resolve patched Undici alias without changing other dependencies
        run: |
          bun install
          bun add undici8@npm:undici@8.12.2 --exact
          grep -E '"undici(8)?": \[' bun.lock
          bun pm ls | grep -E 'undici(@|8@)' || true
      - name: Upload integrity-resolved lock
        uses: actions/upload-artifact@v7
        with:
          name: patched-undici-lockfile
          path: bun.lock
          if-no-files-found: error
          retention-days: 1

  astra-native-certification-policy:
    name: Astra native-route policy (dependency-free)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify bootstrap and pinned-route separation
        run: bun scripts/verification/astra-native-certification-policy.mjs
      - name: Test bounded local Astra candidate diagnostic
        run: node --test scripts/verification/astra-local-candidate-check.test.mjs

  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: High severity dependency audit
        shell: bash
        run: |
          set +e
          transient=0
          for attempt in 1 2; do
            echo "Dependency audit attempt ${attempt}/2"
            : > audit-output.log
            timeout --signal=TERM --kill-after=5s 30s bun audit --audit-level high 2>&1 | tee audit-output.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi

            transient=0
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || grep -Eqi 'ConnectionClosed|audit request failed|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND|socket hang up|network' audit-output.log; then
              transient=1
            fi

            if [ "$transient" -eq 1 ]; then
              if [ "$attempt" -lt 2 ]; then
                echo "Transient audit service/network failure; retrying once."
                sleep 5
                continue
              fi
              echo "::warning title=Dependency audit unavailable::bun audit timed out or hit a network/service error after two bounded attempts. No advisory result was returned; continuing with build, typecheck and tests."
              exit 0
            fi

            # A non-transient nonzero result is a real audit failure (for example,
            # a high-severity advisory) and must continue to block CI.
            exit "$rc"
          done

          exit 1

      - name: Production build and route generation
        run: bun run build

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck-output.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typecheck-output
          path: typecheck-output.log
          if-no-files-found: warn
          retention-days: 1

      - name: Tests
        env:
          # Runtime model calls are mocked in Vitest. This non-secret placeholder
          # lets provider-preflight coverage reach those mocked execution paths.
          OPENAI_API_KEY: ci-test-provider-placeholder
        run: bun run test -- --reporter=junit --outputFile=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-results
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Astra certification isolated Postgres quality and scope tests
        run: bun run test:astra-certification-rpc

      - name: Trust Fabric isolated Postgres access-control tests
        run: bun run test:trust-fabric

      - name: Connector recovery isolated Postgres access-control tests
        run: bun run test:connector-recovery

      - name: Browser recovery isolated Postgres access-control tests
        run: bun run test:browser-recovery

      - name: Customer operations isolated Postgres access-control tests
        run: bun run test:customer-recovery

      - name: Personal workspace isolated Postgres access-control tests
        run: bun run test:personal-recovery

      - name: Content workspace isolated Postgres access-control tests
        run: bun run test:content-recovery

      - name: Studio and analytics isolated Postgres access-control tests
        run: bun run test:studio-recovery

      - name: Private operations isolated Postgres access-control tests
        run: bun run test:private-recovery

      - name: Project and team isolated Postgres access-control tests
        run: bun run test:project-team-recovery

      - name: Agent governance isolated Postgres access-control tests
        run: bun run test:governance-recovery

      - name: Trusted media isolated Postgres access-control tests
        run: bun run test:trusted-media-recovery

      - name: Developer API isolated Postgres access-control tests
        run: bun run test:developer-api-recovery

      - name: Provider job isolated Postgres access-control tests
        run: bun run test:provider-job-recovery

      - name: Builder isolated Postgres access-control tests
        run: bun run test:builder-authority-recovery

      - name: Marketplace compatibility isolated Postgres access-control tests
        run: bun run test:marketplace-compatibility

      - name: Free Open3D worker Python syntax and safety tests
        run: |
          python3 -m py_compile workers/open3d-free/server.py workers/open3d-free/run_model.py
          python3 -m unittest discover -s workers/open3d-free -p 'test_*.py'

      - name: Windows browser worker PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem browser-worker/windows/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "Invalid PowerShell syntax: $($file.Name)"
            }
          }

      - name: Browser worker syntax and policy tests
        working-directory: browser-worker
        run: |
          npm run check
          npm test
