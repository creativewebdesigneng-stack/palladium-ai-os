name: Backend Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: High severity dependency audit
        run: bun audit --audit-level high

      - name: Production build and route generation
        run: bun run build

      - name: Typecheck
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload typecheck diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: /tmp/typecheck.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Tests
        run: bun run test

      - name: Browser worker syntax and policy tests
        working-directory: browser-worker
        run: |
          npm run check
          npm test
