name: One-shot secure dependency refresh
on:
  push:
    branches:
      - feat/builder-production-publish
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builder-production-publish
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Refresh compatible dependency graph
        run: bun update
      - name: Require zero high severity advisories
        run: bun audit --audit-level high
      - name: Commit audited dependency graph and self-delete
        run: |
          rm .github/workflows/one-shot-secure-dependencies.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock .github/workflows/one-shot-secure-dependencies.yml
          git commit -m "chore: refresh audited dependencies"
          git push origin HEAD:feat/builder-production-publish
