name: One-shot secure dependency refresh
on:
  push:
    branches:
      - feat/builder-production-publish
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builder-production-publish
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Pin patched transitive versions
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.overrides={...(p.overrides||{}),'brace-expansion':'1.1.18','nanoid':'3.3.18','js-yaml':'4.3.1'};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Resolve audited dependency graph
        run: bun install
      - name: Require zero high severity advisories
        run: bun audit --audit-level high
      - name: Production build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Browser worker checks
        working-directory: browser-worker
        run: |
          npm run check
          npm test
      - name: Commit validated dependency graph and self-delete
        run: |
          rm .github/workflows/one-shot-secure-dependencies.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock .github/workflows/one-shot-secure-dependencies.yml
          git commit -m "chore: pin audited transitive dependencies"
          git push origin HEAD:feat/builder-production-publish
