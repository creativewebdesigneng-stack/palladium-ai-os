name: One-shot final release validation
on:
  push:
    branches:
      - feat/builder-production-publish
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builder-production-publish
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: High severity dependency audit
        run: bun audit --audit-level high
      - name: Production build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Browser worker checks
        working-directory: browser-worker
        run: |
          npm run check
          npm test
      - name: Self-delete after successful validation
        run: |
          rm .github/workflows/one-shot-final-release-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/one-shot-final-release-validation.yml
          git commit -m "chore: complete final release validation"
          git push origin HEAD:feat/builder-production-publish
