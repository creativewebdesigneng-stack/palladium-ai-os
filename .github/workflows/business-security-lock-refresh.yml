name: Temporary six-agent security dependency lock refresh

on:
  push:
    branches: [feat/six-agent-business-operations]
    paths:
      - .github/workflows/business-security-lock-refresh.yml

permissions:
  contents: write

jobs:
  audit-and-commit-patched-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Pin only the newly disclosed high-severity fixes
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          manifest.dependencies.zod = '4.6.6'
          // E2B >=2.56 drops the vulnerable pinned undici8 fallback alias.
          // The CI build and TypeScript tests must validate SDK compatibility.
          manifest.dependencies.e2b = '2.59.0'
          delete manifest.overrides.undici8
          manifest.overrides = {
            ...manifest.overrides,
            'body-parser': '2.4.0',
            'zod': '4.6.6',
            'undici': '8.12.3',
          }
          fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n')
          NODE
          bun install --lockfile-only
          bun install --frozen-lockfile
          bun audit --audit-level high
      - name: Export exact verified frozen lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: six-agent-security-lock-review
          path: |
            package.json
            bun.lock
          retention-days: 2
      - name: Commit only verified manifest and lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "security(deps): patch body-parser, zod and undici high advisories"
          git push origin HEAD:refs/heads/feat/six-agent-business-operations
