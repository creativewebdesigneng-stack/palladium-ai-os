name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke canonical production
        id: smoke
        shell: bash
        env:
          BLACKSTAR_PRODUCTION_URL: https://palladium-ai-os.vercel.app
        run: |
          set -o pipefail
          bun run smoke:production 2>&1 | tee production-smoke.log

      - name: Publish smoke summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Blackstar production smoke"
            echo
            echo '```text'
            if [ -f production-smoke.log ]; then
              cat production-smoke.log
            else
              echo "Smoke log was not produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke.log
          if-no-files-found: warn
          retention-days: 7
