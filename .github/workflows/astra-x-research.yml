name: Astra X research checks

on:
  push:
    branches:
      - "feature/astra-x-foundation-*"
    paths:
      - "research/astra-x/**"
      - ".github/workflows/astra-x-research.yml"
  pull_request:
    paths:
      - "research/astra-x/**"
      - ".github/workflows/astra-x-research.yml"

permissions:
  contents: read

jobs:
  python-tests:
    name: Astra X unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/astra-x
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest
